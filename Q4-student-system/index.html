<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Information System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 class="text-center my-4">Student Information System</h1>

    <!-- Form to add / modify student -->
    <div class="card p-3 mb-4">
      <h4 id="formTitle">Add Student</h4>
      <input type="hidden" id="editIndex" value="">
      <div class="row">
        <div class="col-md-3 mb-2">
          <input type="text" id="roll" class="form-control" placeholder="Roll No">
        </div>
        <div class="col-md-3 mb-2">
          <input type="text" id="name" class="form-control" placeholder="Name">
        </div>
        <div class="col-md-3 mb-2">
          <input type="text" id="course" class="form-control" placeholder="Course">
        </div>
        <div class="col-md-3 mb-2">
          <input type="text" id="email" class="form-control" placeholder="Email">
        </div>
      </div>
      <div>
        <button id="saveBtn" class="btn btn-success">Add Student</button>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>
      <p id="message" class="mt-2"></p>
    </div>

    <!-- Search box -->
    <input type="text" id="search" class="form-control mb-3" placeholder="Search student by name...">

    <!-- Student table -->
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Course</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTable">
        <!-- rows will be added by jQuery -->
      </tbody>
    </table>

    <p id="emptyMsg" class="text-center text-muted">No students added yet.</p>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
